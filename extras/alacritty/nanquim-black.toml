# Nanquim Black — alacritty
# Usage: copy to ~/.config/alacritty/ and add to alacritty.toml (Alacritty 0.14+):
#   [general]
#   import = ["~/.config/alacritty/nanquim-black.toml"]
[colors.primary]
background = "#000000"
foreground = "#D9D9D9"

[colors.cursor]
cursor = "#FFCC00"
text = "#000000"

[colors.selection]
background = "#26292D"
text = "CellForeground"

[colors.normal]
black = "#26292D"
red = "#C85E60"
green = "#A3C679"
yellow = "#D5B05F"
blue = "#6A90D0"
magenta = "#A178C4"
cyan = "#6EBAD7"
white = "#D9D9D9"

[colors.bright]
black = "#5C5D63"
red = "#D97A7C"
green = "#B8D696"
yellow = "#E2C47F"
blue = "#89A9DE"
magenta = "#B795D4"
cyan = "#8CCBE3"
white = "#FFFFFF"
